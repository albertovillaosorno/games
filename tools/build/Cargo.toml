[package]
name = "games-build"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Host-side asset import and game build composition"
keywords.workspace = true
categories.workspace = true

[features]
native-preview = [
    "dep:games",
    "games-platform/interactive",
]

[dependencies]
games-assets.workspace = true
games-platform = { workspace = true, features = [
    "android-packaging", "importer",
] }

serde.workspace = true
serde_json.workspace = true
games = { workspace = true, optional = true }

[dev-dependencies]
games-platform = { workspace = true, features = ["test-fixtures"] }

[lints]
workspace = true
