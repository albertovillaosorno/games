[package]
name = "games-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Native platform adapters for the shared game engine"
keywords.workspace = true
categories.workspace = true

[dependencies]
games.workspace = true
games-assets.workspace = true
games-importer = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { workspace = true, optional = true, features = [
    "hidapi", "use-pkgconfig",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true, optional = true }
sdl2 = { workspace = true, optional = true, features = ["hidapi"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rcgen.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "CanvasRenderingContext2d", "Document", "DomRect", "DomRectReadOnly",
    "Element", "Event",
    "EventTarget", "HtmlCanvasElement", "HtmlElement", "ImageData",
    "KeyboardEvent", "KeyboardEventInit",
    "MouseEvent", "Node", "Performance", "PointerEvent", "PointerEventInit",
    "Storage", "Window",
] }

[features]
application-entry = ["dep:inventory", "dep:jni"]
browser-graphics = [
    "web-sys/WebGl2RenderingContext",
    "web-sys/WebGlContextAttributes",
    "web-sys/WebGlFramebuffer",
    "web-sys/WebGlProgram",
    "web-sys/WebGlShader",
    "web-sys/WebGlTexture",
    "web-sys/WebGlUniformLocation",
]
importer = ["dep:games-importer"]
interactive = [
    "browser-graphics",
    "dep:sdl2",
    "web-sys/AudioBuffer",
    "web-sys/AudioBufferSourceNode",
    "web-sys/AudioContext",
    "web-sys/AudioContextOptions",
    "web-sys/AudioContextState",
    "web-sys/AudioDestinationNode",
    "web-sys/AudioNode",
    "web-sys/AudioScheduledSourceNode",
    "web-sys/Blob",
    "web-sys/File",
    "web-sys/FileList",
    "web-sys/Gamepad",
    "web-sys/GamepadButton",
    "web-sys/GamepadEvent",
    "web-sys/GamepadMappingType",
    "web-sys/Navigator",
    "web-sys/HtmlInputElement",
]
secure-lan = ["dep:rustls"]
test-fixtures = ["browser-graphics"]

[lints]
workspace = true
