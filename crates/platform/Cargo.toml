[package]
name = "games-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Native platform adapters for the shared game engine"
keywords.workspace = true
categories.workspace = true

[dependencies]
games.workspace = true
games-assets.workspace = true
games-importer = { workspace = true, optional = true }
sha2.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { workspace = true, optional = true, features = ["hidapi"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rcgen.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Document", "DomRect", "DomRectReadOnly", "Element", "Event",
    "EventTarget", "HtmlElement", "KeyboardEvent", "KeyboardEventInit",
    "MouseEvent", "Node", "Performance", "PointerEvent", "PointerEventInit",
    "Storage", "Window",
] }

[features]
importer = ["dep:games-importer"]
interactive = ["dep:sdl2"]
secure-lan = ["dep:rustls"]
test-fixtures = []

[lints]
workspace = true
