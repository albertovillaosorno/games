[package]
name = "games-simpsons-arcade"
default-run = "simpsons-arcade"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Four-player Simpsons arcade remake gameplay"
keywords.workspace = true
categories.workspace = true

[dependencies]
games.workspace = true
games-assets = { workspace = true, optional = true }
games-platform = { workspace = true, optional = true }

[lints]
workspace = true

[features]
browser-audio-smoke = [
    "dep:games-platform",
    "games-platform/interactive",
    "games-platform/test-fixtures",
]
browser-frame-smoke = ["dep:games-platform", "games-platform/interactive"]
browser-input-smoke = ["dep:games-platform", "games-platform/test-fixtures"]
browser-scene-smoke = ["dep:games-platform", "games-platform/test-fixtures"]
browser-storage-smoke = ["dep:games-platform"]
browser-webgl-smoke = ["dep:games-platform", "games-platform/test-fixtures"]
browser-window-smoke = ["dep:games-platform", "games-platform/interactive"]
native-preview = [
    "dep:games-assets",
    "dep:games-platform",
    "games-platform/interactive",
    "games-platform/secure-lan",
]

[dev-dependencies]
games-platform = { workspace = true, features = ["test-fixtures"] }
rcgen.workspace = true

[[bin]]
name = "simpsons-arcade"
path = "src/main.rs"
required-features = ["native-preview"]

[[bin]]
name = "simpsons-arcade-core-smoke"
path = "src/bin/core-smoke.rs"

[[bin]]
name = "simpsons-arcade-browser-storage-smoke"
path = "src/bin/browser-storage-smoke.rs"
required-features = ["browser-storage-smoke"]

[[bin]]
name = "simpsons-arcade-browser-input-smoke"
path = "src/bin/browser-input-smoke.rs"
required-features = ["browser-input-smoke"]

[[bin]]
name = "simpsons-arcade-browser-scene-smoke"
path = "src/bin/browser-scene-smoke.rs"
required-features = ["browser-scene-smoke"]

[[bin]]
name = "simpsons-arcade-browser-audio-smoke"
path = "src/bin/browser-audio-smoke.rs"
required-features = ["browser-audio-smoke"]

[[bin]]
name = "simpsons-arcade-browser-webgl-smoke"
path = "src/bin/browser-webgl-smoke.rs"
required-features = ["browser-webgl-smoke"]

[[bin]]
name = "simpsons-arcade-browser-window-smoke"
path = "src/bin/browser-window-smoke.rs"
required-features = ["browser-window-smoke"]

[[bin]]
name = "simpsons-arcade-browser-frame-smoke"
path = "src/bin/browser-frame-smoke.rs"
required-features = ["browser-frame-smoke"]
