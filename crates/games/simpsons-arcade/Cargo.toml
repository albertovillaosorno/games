[package]
name = "games-simpsons-arcade"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Four-player Simpsons arcade remake gameplay"
keywords.workspace = true
categories.workspace = true

[dependencies]
games.workspace = true
games-assets = { workspace = true, optional = true }
games-platform = { workspace = true, optional = true }

[lints]
workspace = true

[features]
native-preview = [
    "dep:games-assets",
    "dep:games-platform",
    "games-platform/interactive",
    "games-platform/secure-lan",
]

[dev-dependencies]
games-platform = { workspace = true, features = ["test-fixtures"] }
rcgen.workspace = true

[[bin]]
name = "simpsons-arcade"
path = "src/main.rs"
required-features = ["native-preview"]
