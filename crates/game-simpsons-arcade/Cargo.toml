[package]
name = "games-simpsons-arcade"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Four-player Simpsons arcade remake gameplay"
keywords.workspace = true
categories.workspace = true

[dependencies]
games.workspace = true

[lints]
workspace = true

[features]
native-preview = [
    "dep:games-assets",
    "dep:games-platform",
    "dep:games-platform-audio",
    "dep:games-platform-graphics",
    "dep:games-platform-storage",
    "dep:rustls",
]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
games-assets = { workspace = true, optional = true }
games-platform = { workspace = true, optional = true }
games-platform-audio = { workspace = true, optional = true }
games-platform-graphics = { workspace = true, optional = true }
games-platform-storage = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
games-platform-storage = { workspace = true, features = ["test-fixtures"] }
rcgen.workspace = true

[[bin]]
name = "simpsons-arcade"
path = "src/main.rs"
required-features = ["native-preview"]
