[package]
name = "games-build"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Host-side asset import and game build composition"
keywords.workspace = true
categories.workspace = true

[features]
native-preview = [
    "dep:games",
    "dep:games-platform",
    "dep:games-platform-audio",
    "dep:games-platform-graphics",
]

[dependencies]
games-assets.workspace = true
games-importer.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
games-platform-storage.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
games = { workspace = true, optional = true }
games-platform = { workspace = true, optional = true }
games-platform-audio = { workspace = true, optional = true }
games-platform-graphics = { workspace = true, optional = true }

[lints]
workspace = true
